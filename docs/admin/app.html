  .spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(0,0,0,.15);border-top-color:var(--indigo);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px;margin-inline-end:6px} @keyframes sp{to{transform:rotate(360deg)}}
  .toast{position:fixed;bottom:22px;inset-inline-start:50%;transform:translateX(-50%);background:#1b1440;color:#fff;border-radius:999px;padding:10px 18px;font-weight:800;font-size:13.5px;z-index:50}
</style>

const STATE = { free_new:["חינם · לפני הפעלה",""], free_activated:["חינם · מופעלת",""], gift:["🎁 במתנה","mint"], gift_expiring:["מתנה מסתיימת","pink"], plus:["👑 טופי+","gold"], returned:["חזרו לחינם",""], inactive:["לא פעילה",""] };

    <div class="card"><h4>איפה ילדים נופלים (30 יום)</h4><div class="tblwrap"><table><tr><th>שאלה</th><th>עולם</th><th>ניסיונות</th><th>נכון</th></tr><tr><td colspan="4" class="empty">דורש ספירה לכל שאלה במכשיר · יתווסף בגרסה הבאה של האפליקציה</td></tr></table></div><div class="stamp" style="margin-top:6px">מתחת ל־35% = כנראה בעיה בשאלה, לא בילדים. מעל 97% = משעממת.</div></div></div>`;
  try { const r = await call("adminListReports"); const rows = r.reports || [];
    const groups = {}; for (const x of rows) { const key = String(x.prompt || x.question || x.id).replace(/\n/g, " "); (groups[key] = groups[key] || { key, items: [], topic: x.topic, grade: x.grade }).items.push(x); }
    const list = Object.values(groups).sort((a, b) => (b.items.some((i) => (i.status || "open") === "open") ? 1 : 0) - (a.items.some((i) => (i.status || "open") === "open") ? 1 : 0));
    const openN = rows.filter((x) => (x.status || "open") === "open").length; $("repChip").textContent = `דיווחים (${openN})`;
    $("reports").innerHTML = list.length ? list.slice(0, 60).map((g) => { const open = g.items.filter((i) => (i.status || "open") === "open"); const st = open.length ? ["פתוח", "gold"] : g.items.some((i) => i.status === "disabled") ? ["השאלה מושבתת", ""] : ["טופל", "mint"]; const last = g.items[0];
      return `<div class="q"><b>${esc(g.key)}</b> · ${esc(TOPIC[g.topic] || g.topic || "")}${g.grade != null ? " · כיתה " + gradeName(g.grade) : ""} <span class="chip ${st[1]}" style="padding:1px 7px;font-size:10px">${st[0]}</span><div class="m">${g.items.length} ${g.items.length === 1 ? "דיווח" : "דיווחים"} · "${esc(last.reason || last.note || last.message || "")}" · ${when(Number(last.createdAt) * (Number(last.createdAt) > 1e12 ? 1 : 1000))}${open.length ? ` · <u data-open="${esc(g.key)}">פתח</u><u data-rs="${open.map((i) => i.id).join(",")}" data-st="disabled">השבת שאלה</u><u data-rs="${open.map((i) => i.id).join(",")}" data-st="resolved">סמן כתקין</u>` : ""}</div><div class="m" hidden data-detail="${esc(g.key)}">${g.items.map((i) => `• ${esc(i.reason || i.note || i.message || "")} · ${when(Number(i.createdAt) * (Number(i.createdAt) > 1e12 ? 1 : 1000))}${i.chosen ? " · ענה/תה: " + esc(i.chosen) : ""}`).join("<br>")}</div></div>`; }).join("") : '<div class="empty">אין דיווחים. 🎉</div>';
    document.querySelectorAll("[data-open]").forEach((u) => u.onclick = () => { const d = document.querySelector(`[data-detail="${CSS.escape(u.dataset.open)}"]`); if (d) d.hidden = !d.hidden; });
    document.querySelectorAll("[data-rs]").forEach((u) => u.onclick = async () => { for (const id of u.dataset.rs.split(",")) await call("adminSetReportStatus", { id, status: u.dataset.st }); await loadJourney(false); content(); });
  } catch (e) { $("reports").textContent = e.message; }
}

// ---------------- 7 · support ----------------
let supTab = "open";
async function support() {
  $("main").innerHTML = `<div class="top"><h3 id="supH">תמיכה</h3><div class="filters" id="supFilters"><span class="chip ${supTab === "open" ? "on" : ""}" data-s="open">פתוחות</span><span class="chip ${supTab === "done" ? "on" : ""}" data-s="done">נענו</span><span class="chip ${supTab === "feedback" ? "on" : ""}" data-s="feedback">פידבק</span><span class="chip dim" id="wl">רשימת המתנה</span></div></div><div class="card"><div class="tblwrap" id="supTbl"><span class="spin"></span></div></div>`;
  try { const r = await call("adminListSupport"); $("wl").textContent = "רשימת המתנה (" + r.waitlist + ")"; const openN = r.items.filter((i) => i.status === "open").length; $("supH").textContent = openN ? `תמיכה · ${openN} פתוחות` : "תמיכה"; $("navSupport").textContent = openN ? openN + " פתוחות" : "";
    const famOf = (i) => (FAM && (FAM.families || []).find((f) => (f.fullId || f.householdID || f.id) === i.householdID)) || null;
    const rows = r.items.filter((i) => supTab === "open" ? i.status === "open" : supTab === "done" ? i.status !== "open" : i.kind === "feedback");
    $("supTbl").innerHTML = rows.length ? `<table><tr><th>מתי</th><th>משפחה</th><th>סוג</th><th>תוכן</th><th>מכשיר · גרסה</th><th></th></tr>${rows.map((i) => { const f = famOf(i); const mail = f && (f.parents || []).map((p) => p.email).find(Boolean);
      return `<tr><td>${when(i.at)}</td><td>${esc(i.family || (f && (f.familyName || f.label)) || "—")}</td><td>💬 פידבק</td><td style="white-space:normal;max-width:420px">${esc(i.text)}</td><td>${esc(i.device)}</td><td style="white-space:nowrap">${mail ? `<a class="btn ghost" href="mailto:${esc(mail)}?subject=${encodeURIComponent("טופי — תשובה לפנייה שלך")}">ענה במייל</a> ` : ""}${i.householdID ? `<a class="btn ghost" href="#families" data-fam="${esc(i.householdID)}">פתח משפחה</a> ` : ""}${i.status === "open" ? `<button class="btn ghost" data-done="${i.id}">סמן כנענה</button>` : "✓"}</td></tr>`; }).join("")}</table>` : '<div class="empty">אין פניות.</div>';
    document.querySelectorAll("[data-done]").forEach((b) => b.onclick = async () => { await call("adminSetSupportStatus", { id: b.dataset.done, status: "done" }); support(); });
    document.querySelectorAll("[data-fam]").forEach((a) => a.onclick = () => { famFilter = "all"; famQuery = ""; });
    document.querySelectorAll("#supFilters [data-s]").forEach((c) => c.onclick = () => { supTab = c.dataset.s; support(); });
  } catch (e) { $("supTbl").textContent = e.message; }
}

// ---------------- 8 · settings ----------------
async function settings() {
  $("main").innerHTML = '<div class="empty"><span class="spin"></span></div>';
  let cfg; try { cfg = (await call("adminGetConfig")).config; } catch (e) { return $("main").innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; }
  const num = (k, w) => `<input type="number" id="k_${k}" value="${cfg[k]}" style="width:${w || 60}px">`;
  $("main").innerHTML = `
    <div class="top"><h3>הגדרות וניסויים</h3><button class="btn" id="saveCfg">שמור</button></div>
    <div class="card"><h4>מנוע ההמרה</h4><div class="knobs">
      <div class="knob"><label>הפעלה</label>${num("activationDays")} ימים פעילים + ${num("activationQuestions")} שאלות</div>
      <div class="knob"><label>אורך המתנה</label>${num("giftDays")} ימים · אפשר להאריך ידנית ממשפחות</div>
      <div class="knob"><label>עולמות אורחים בחינם</label>${num("guestWorlds", 50)} · מתחלפים כל ${num("guestRotateDays", 50)} ימים · בחירה: אוטומטי לפי כיתה<br><select id="k_guestTopics" multiple size="4" style="margin-top:6px" title="ברירת המחדל לשבוע הראשון">${Object.entries(BASE).map(([t, l]) => `<option value="${t}" ${(cfg.guestTopics || []).includes(t) ? "selected" : ""}>${l}</option>`).join("")}</select></div>
      <div class="knob"><label>עולמות נעולים מוצגים</label>${num("lockedShown", 50)} · מתחלפים כל ${num("lockedRotateDays", 50)} ימים</div>
      <div class="knob"><label>ימי הפושים במתנה</label><input id="k_giftPushDays" value="${(cfg.giftPushDays || []).join(" · ")}"> שעה ${num("giftPushHour", 50)}:00</div>
      <div class="knob"><label>מסלול בלי מנוי</label><select id="k_oneTimeAfterGiftOnly"><option value="true" ${cfg.oneTimeAfterGiftOnly ? "selected" : ""}>מופיע אחרי סוף המתנה</option><option value="false" ${!cfg.oneTimeAfterGiftOnly ? "selected" : ""}>מופיע תמיד</option></select></div>
      <div class="knob"><label>פייוול</label><select id="k_paywall"><option value="personal" ${cfg.paywall === "personal" ? "selected" : ""}>אישי · שנתי מודגש</option><option value="generic" ${cfg.paywall === "generic" ? "selected" : ""}>גנרי (ניסוי, כבוי)</option></select></div>
      <div class="knob"><label>ניסיון StoreKit</label><select id="k_storeKitTrial"><option value="false" ${!cfg.storeKitTrial ? "selected" : ""}>כבוי (המתנה במקום)</option><option value="true" ${cfg.storeKitTrial ? "selected" : ""}>דלוק</option></select></div>
    </div></div>
    <div class="card"><h4>ניסויים (אחד בכל פעם, 50/50, לפי משפחה)</h4><div class="tblwrap"><table><tr><th>ניסוי</th><th>א׳</th><th>ב׳</th><th>מדד</th><th>מצב</th></tr>
      <tr><td>אורך המתנה</td><td>14 יום</td><td>21 יום</td><td>מופעלות → משלמות</td><td><span class="chip dim" style="padding:1px 7px;font-size:11px">מוכן · לא רץ</span></td></tr>
      <tr><td>סף הפעלה</td><td>3 ימים + 40</td><td>5 ימים + 60</td><td>הגיעו למתנה · חוו ערך</td><td><span class="chip dim" style="padding:1px 7px;font-size:11px">מוכן · לא רץ</span></td></tr>
      <tr><td>פייוול</td><td>אישי</td><td>גנרי</td><td>פייוול → רכישה</td><td><span class="chip dim" style="padding:1px 7px;font-size:11px">מוכן · לא רץ</span></td></tr></table></div>
      <div class="stamp" style="margin-top:6px">מפעילים רק אחרי 300+ משפחות מופעלות. עד אז המספרים לא מובהקים.</div></div>
    <div class="card"><h4>נוסחים (עריכה בלי בילד)</h4>
      <div class="q"><b>פוש ההפעלה</b><textarea id="k_copyActivation">${esc(cfg.copyActivation)}</textarea></div>
      <div class="q"><b>48 שעות לפני</b><textarea id="k_copyTwoDays">${esc(cfg.copyTwoDays)}</textarea></div>
      <div class="stamp">משתנים: {שם} {שאלות} {ימים} {תאריך} {עולם אהוב} {חזרות} {מחיר חודשי בשנתי}</div></div>`;
  $("saveCfg").onclick = async () => { const v = (k) => document.getElementById("k_" + k).value;
    const config = { activationDays: +v("activationDays"), activationQuestions: +v("activationQuestions"), giftDays: +v("giftDays"), guestWorlds: +v("guestWorlds"), guestRotateDays: +v("guestRotateDays"), lockedShown: +v("lockedShown"), lockedRotateDays: +v("lockedRotateDays"),
      giftPushDays: v("giftPushDays").split(/[^0-9]+/).filter(Boolean).map(Number), giftPushHour: +v("giftPushHour"), oneTimeAfterGiftOnly: v("oneTimeAfterGiftOnly") === "true", paywall: v("paywall"), storeKitTrial: v("storeKitTrial") === "true",
      guestTopics: [...document.getElementById("k_guestTopics").selectedOptions].map((o) => o.value), copyActivation: v("copyActivation"), copyTwoDays: v("copyTwoDays") };
    $("saveCfg").disabled = true; try { await call("adminSetConfig", { config }); toast("נשמר ✅"); await loadJourney(true); } catch (e) { toast("נכשל: " + e.message); } $("saveCfg").disabled = false; };
}
</script>
</body>
</html>
