<style>

  *{box-sizing:border-box} [hidden]{display:none!important}
  body{margin:0;background:var(--page);color:var(--ink);font-family:Heebo,system-ui,sans-serif;direction:rtl;min-height:100vh}

  .main{padding:18px 22px;max-width:1160px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .top h3{font:800 18px Rubik,sans-serif;margin:0} .stamp{font-size:12px;color:var(--muted)}
  .filters{display:flex;gap:6px;flex-wrap:wrap} .chip{border:1px solid var(--line);border-radius:99px;padding:5px 11px;font:700 12.5px Rubik,sans-serif;color:var(--muted);background:var(--card);cursor:pointer} .chip.on{background:var(--indigo);color:#fff;border-color:transparent}
  .chip.mint{background:rgba(14,158,114,.15);color:var(--good);border-color:transparent;cursor:default} .chip.gold{background:rgba(245,184,0,.18);color:#7a5a00;border-color:transparent;cursor:default} .chip.pink{background:rgba(255,107,157,.18);color:#a1244e;border-color:transparent;cursor:default} .chip.dim{color:var(--muted);cursor:default}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
  .kpi{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:12px 14px} .kpi b{display:block;font:900 26px Rubik,sans-serif;line-height:1.1} .kpi span{font-size:12px;color:var(--muted)} .kpi i{font-style:normal;font-size:12px;font-weight:800;color:var(--good)} .kpi i.d{color:var(--warn)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px} @media (max-width:900px){.grid2{grid-template-columns:1fr}.shell{grid-template-columns:1fr}.side{position:static;height:auto}}

  .card h4{font:800 13.5px Rubik,sans-serif;margin:0 0 8px;color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:13px} th{font:700 12px Rubik,sans-serif;color:var(--muted);text-align:right;padding:7px 9px;border-bottom:1px solid var(--line)} td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top} tr:last-child td{border-bottom:0}
  .tblwrap{overflow-x:auto}
  .bar{height:10px;border-radius:5px;background:linear-gradient(90deg,#7A5CFF,#3E8BF0)} .barw{background:var(--line);border-radius:5px}
  .spark{display:flex;align-items:flex-end;gap:2px;height:38px} .spark i{flex:1;background:#7A5CFF;border-radius:2px 2px 0 0;opacity:.85;min-height:2px}
  .btn{display:inline-block;border-radius:10px;padding:8px 14px;font:800 13px Rubik,sans-serif;background:var(--indigo);color:#fff;border:0;cursor:pointer;font-family:Rubik,sans-serif} .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)} .btn.danger{background:rgba(255,107,157,.2);color:#a1244e} .btn:disabled{opacity:.5}
  .sw{display:inline-block;width:38px;height:22px;border-radius:99px;background:var(--line);position:relative;vertical-align:middle;cursor:pointer} .sw::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s} .sw.on{background:var(--good)} .sw.on::after{inset-inline-start:18px}
  .money{color:var(--good);font-weight:800}
  .fam{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--card)}

  .fam .acts{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}

  .funnel .f{display:grid;grid-template-columns:170px 1fr 60px 50px;gap:8px;align-items:center;font-size:12.5px;margin:4px 0} .funnel .f .n{font:800 12.5px Rubik,sans-serif;text-align:left} .funnel .f .p{color:var(--muted);text-align:left}
  .knobs{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}

  .knob input,.knob select,textarea{font-family:inherit;font-size:13px;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:5px 8px;width:100%} .knob input[type=number]{width:70px;display:inline-block} textarea{min-height:60px;margin-top:4px}
  .q{font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:6px} .q b{font-family:Rubik,sans-serif} .q .m{color:var(--muted);font-size:12px} .q u{cursor:pointer;color:var(--indigo);margin-inline-end:8px}
  .feed div.i{display:grid;grid-template-columns:52px 1fr;gap:8px;font-size:12.5px;padding:6px 0;border-bottom:1px dashed var(--line)} .feed span{color:var(--muted);font-size:11.5px}
  .empty{color:var(--muted);font-size:13px;padding:8px 0}
  .gate{max-width:420px;margin:12vh auto 0;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:38px 30px}
  .gate h1{font:900 24px Rubik,sans-serif;margin:0 0 6px} .gate p{color:var(--muted);font-size:14px;margin:0 0 22px} .gate button{font-family:inherit;cursor:pointer;font-weight:800;font-size:16px;border:0;border-radius:999px;padding:13px 30px;background:var(--gold);color:#3a2c00}
  .msg{margin-top:16px;font-size:13px;color:var(--muted);min-height:20px} .msg.err{color:#a1244e;font-weight:700}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(0,0,0,.15);border-top-color:var(--indigo);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px;margin-inline-end:6px} @keyframes sp{to{transform:rotate(360deg)}}
  .toast{position:fixed;bottom:22px;inset-inline-start:50%;transform:translateX(-50%);background:#1b1440;color:#fff;border-radius:999px;padding:10px 18px;font-weight:800;font-size:13.5px;z-index:50}
  .tag{font:800 10px Rubik,sans-serif;border-radius:99px;padding:1px 7px;background:rgba(14,158,114,.15);color:var(--good)}
</style>
</head>
<body>
<div class="gate" id="gate" hidden><h1>🔐 כניסת מנהל המוצר</h1><p>הכניסה עם חשבון Google מורשה בלבד. כל שאר החשבונות נדחים בצד השרת.</p><button id="loginBtn">התחבר עם Google</button><div class="msg" id="gateMsg"></div></div>

</div>

<script type="module">
const CONFIG = { firebase: { apiKey: "AIzaSyCjZFUZFXwsbNrDA8Icw_ZZ-bPGARCLMLI", authDomain: "childtime-86e98.firebaseapp.com", projectId: "childtime-86e98" }, adminEmails: ["ranioph@gmail.com", "amitgolans@gmail.com"] };
const PACKS = { soccer:{name:"עולם הכדורגל",emoji:"⚽"}, dinosaurs:{name:"דינוזאורים",emoji:"🦖"}, space:{name:"חלל וכוכבים",emoji:"🚀"}, animals:{name:"עולם החיות",emoji:"🐾"}, sea:{name:"מעמקי הים",emoji:"🌊"}, gifted:{name:"הכנה למחוננים",emoji:"🧠"}, food:{name:"מטבח ומדע של אוכל",emoji:"🍳"}, israel:{name:"ישראל שלי",emoji:"🏛️"}, music:{name:"מוזיקה",emoji:"🎵"}, body:{name:"גוף האדם",emoji:"🧍"}, vehicles:{name:"כלי רכב ותחבורה",emoji:"🚗"}, flags:{name:"דגלים ומדינות",emoji:"🌍"} };
const PACK_Q = { soccer:82, dinosaurs:70, space:70, animals:70, sea:70, gifted:70, food:70, israel:70, music:70, body:70, vehicles:70, flags:70 };
const BASE = { math:"🧮 ממלכת המתמטיקה", english:"🔤 ארץ אנגלית", hebrew:"✍️ ארץ העברית", logic:"🧩 חידות הלוגיקה", science:"🔬 מעבדת המדעים", history:"🏛️ מוזיאון ההיסטוריה", geography:"🌍 מסע סביב העולם", money:"💰 שוק הכסף", reading:"📖 יער הסיפורים" };
const STATE = { free_new:["חינם · לפני הפעלה",""], free_activated:["חינם · מופעלת",""], gift:["🎁 במתנה","mint"], gift_expiring:["מתנה מסתיימת","pink"], plus:["👑 טופי+","gold"], returned:["חזרו לחינם",""], inactive:["לא פעילה",""] };
const $ = (id) => document.getElementById(id);

const fmt = (n) => Number(n || 0).toLocaleString("he-IL");
const when = (ms) => ms ? new Date(ms).toLocaleString("he-IL", { day: "numeric", month: "numeric", hour: "2-digit", minute: "2-digit" }) : "";

const [{initializeApp}, auth, fns] = await Promise.all([
  import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"),
  import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"),
  import("https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js"),
]);
const fbApp = initializeApp(CONFIG.firebase), authI = auth.getAuth(fbApp), functionsI = fns.getFunctions(fbApp);
const call = (name, data) => fns.httpsCallable(functionsI, name)(data || {}).then((r) => r.data);
const provider = new auth.GoogleAuthProvider();
$("loginBtn").onclick = async () => { $("gateMsg").className = "msg"; $("gateMsg").innerHTML = '<span class="spin"></span> מתחבר…'; try { await auth.signInWithPopup(authI, provider); } catch (e) { $("gateMsg").className = "msg err"; $("gateMsg").textContent = "ההתחברות נכשלה: " + e.code; } };
$("logoutBtn").onclick = () => auth.signOut(authI);

let J = null, FAM = null, PACKSTATE = null;
auth.onAuthStateChanged(authI, async (user) => {
  if (!user) { $("gate").hidden = false; $("app").hidden = true; return; }
  const email = (user.email || "").toLowerCase();
  if (!CONFIG.adminEmails.map((e) => e.toLowerCase()).includes(email)) { $("gateMsg").className = "msg err"; $("gateMsg").textContent = "החשבון " + email + " אינו מורשה."; await auth.signOut(authI); return; }
  $("gate").hidden = true; $("app").hidden = false; $("whoName").textContent = user.email;
  await loadJourney(false); route();
});
$("refreshBtn").onclick = async () => { $("stamp").innerHTML = '<span class="spin"></span>'; await loadJourney(true); route(); toast("עודכן"); };
async function loadJourney(recompute) {
  try { J = await call("adminJourney", { recompute }); } catch (e) { J = null; toast("טעינה נכשלה: " + (e.message || e)); }
  if (J) { $("stamp").textContent = "עודכן " + when(J.computedAt); const st = J.states || {};
    $("navFamilies").textContent = fmt(J.overview.activeFamilies30) + " פעילות"; $("navContent").textContent = J.overview.openReports ? J.overview.openReports + " דיווחים חדשים" : ""; }
}

const kpi = (v, l, delta) => `<div class="kpi"><b>${v}</b><span>${l}</span> ${delta ? `<i class="${delta.startsWith("-") ? "d" : ""}">${delta}</i>` : ""}</div>`;
const funnelRow = (label, n, base, prev) => `<div class="f"><span>${label}</span><div class="barw"><div class="bar" style="width:${base ? Math.max(1, Math.round(100 * n / base)) : 0}%"></div></div><span class="n">${fmt(n)}</span><span class="p">${prev ? Math.round(100 * n / prev) + "%" : ""}</span></div>`;

// ---------------- 1 · dashboard ----------------
async function dashboard() {

// ---------------- 2 · families ----------------
let famFilter = "all";
async function families() {
  $("main").innerHTML = '<div class="empty"><span class="spin"></span> טוען משפחות…</div>';
  if (!FAM) { try { FAM = await call("adminFamiliesOverview"); } catch (e) { return $("main").innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; } }

  const chips = [["all", "הכל"], ["free_new", "לפני הפעלה"], ["free_activated", "מופעלות"], ["gift", "במתנה"], ["gift_expiring", "מסתיימת"], ["plus", "טופי+"], ["returned", "חזרו לחינם"], ["inactive", "לא פעילות"]];
  const shown = fams.filter((f) => famFilter === "all" || (f.j.state || "free_new") === famFilter).sort((a, b) => (b.j.lastActive || "").localeCompare(a.j.lastActive || ""));
  $("main").innerHTML = `

  $("famSearch").oninput = (e) => { const q = e.target.value.trim(); $("famList").innerHTML = shown.filter((f) => !q || JSON.stringify(f).includes(q)).map(famCard).join(""); wireFam(); };
  wireFam();

      <tr><td>סף הפעלה</td><td>3 ימים + 40</td><td>5 ימים + 60</td><td>הגיעו למתנה · חוו ערך</td><td><span class="chip dim" style="padding:1px 7px;font-size:11px">מוכן · לא רץ</span></td></tr>
      <tr><td>פייוול</td><td>אישי</td><td>גנרי</td><td>פייוול → רכישה</td><td><span class="chip dim" style="padding:1px 7px;font-size:11px">מוכן · לא רץ</span></td></tr></table></div>

    <div class="card"><h4>נוסחים (עריכה בלי בילד)</h4>
      <div class="q"><b>פוש ההפעלה</b><textarea id="k_copyActivation">${esc(cfg.copyActivation)}</textarea></div>
      <div class="q"><b>48 שעות לפני</b><textarea id="k_copyTwoDays">${esc(cfg.copyTwoDays)}</textarea></div>
      <div class="stamp">משתנים: {שם} {שאלות} {ימים} {תאריך} {עולם אהוב} {חזרות} {מחיר חודשי בשנתי}</div></div>`;
  $("saveCfg").onclick = async () => { const v = (k) => document.getElementById("k_" + k).value;
    const config = { activationDays: +v("activationDays"), activationQuestions: +v("activationQuestions"), giftDays: +v("giftDays"), guestWorlds: +v("guestWorlds"), guestRotateDays: +v("guestRotateDays"), lockedShown: +v("lockedShown"), lockedRotateDays: +v("lockedRotateDays"),
      giftPushDays: v("giftPushDays").split(/[^0-9]+/).filter(Boolean).map(Number), giftPushHour: +v("giftPushHour"), oneTimeAfterGiftOnly: v("oneTimeAfterGiftOnly") === "true", paywall: v("paywall"), storeKitTrial: v("storeKitTrial") === "true",
      guestTopics: [...document.getElementById("k_guestTopics").selectedOptions].map((o) => o.value), copyActivation: v("copyActivation"), copyTwoDays: v("copyTwoDays") };
    $("saveCfg").disabled = true; try { await call("adminSetConfig", { config }); toast("נשמר ✅"); await loadJourney(true); } catch (e) { toast("נכשל: " + e.message); } $("saveCfg").disabled = false; };
