// ---------------- 2 · families ----------------
let famFilter = "all", famQuery = "";
let famSort = { key: "active", dir: -1 };   // quiet families first is the default question
const FILTERS = [["all", "הכל"], ["gift", "במתנה"], ["gift_expiring", "מסתיימת"], ["plus", "טופי+"], ["returned", "חזרו לחינם"], ["inactive", "לא פעילות"], ["demo", "🧪 דמו"]];
async function families() {
  if (!FAM) { $("main").innerHTML = '<div class="empty"><span class="spin"></span> טוען משפחות…</div>'; try { FAM = await call("adminFamiliesOverview"); } catch (e) { return $("main").innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; } }
  const fams = (FAM.families || []).map((f) => ({ ...f, hh: f.fullId || f.householdID || f.id, j: (J && J.households && J.households[f.fullId || f.householdID || f.id]) || {} }));
  const q = famQuery.trim();
  const hay = (f) => [f.familyName, f.label, f.name, ...(f.parents || []).map((p) => (p.email || "") + " " + (p.name || "")), ...(f.children || []).map((k) => k.name)].join(" ");
  // 🧪 A family marked as demo never pollutes the real lists — it shows only
  // under its own chip, where it can be un-marked.
  const inFilter = (f) => famFilter === "demo" ? !!f.isDemo
    : !f.isDemo && (famFilter === "all" || (f.j.state || "free_new") === famFilter);
  // What each filter chip is worth, so the numbers are visible before clicking.
  const countFor = (k) => k === "demo" ? fams.filter((f) => f.isDemo).length
    : k === "all" ? fams.filter((f) => !f.isDemo).length
    : fams.filter((f) => !f.isDemo && (f.j.state || "free_new") === k).length;
  // Sorting: the column the founder picked, newest activity first by default.
  const STATE_ORDER = { plus: 0, gift_expiring: 1, gift: 2, returned: 3, free_new: 4, inactive: 5 };
  const sortKey = (f) => {
    const st = famStats(f);
    switch (famSort.key) {
      case "name": return famName(f);
      case "state": return STATE_ORDER[(f.j.state || "free_new")] ?? 9;
      case "kids": return st.kids;
      case "today": return st.today;
      case "joined": return st.joined;
      default: return st.when.days;
    }
  };
  const bySort = (a, b) => {
    const x = sortKey(a), y = sortKey(b);
    const c = typeof x === "string" ? x.localeCompare(y, "he") : (x - y);
    return famSort.dir > 0 ? c : -c;
  };
  // On "הכל" the demo families are not hidden — they sit in their own section
  // at the bottom, so they never mix into the real list but are one scroll away.
  const listHTML = () => {
    const qq = famQuery.trim();
    const ok = (f) => !qq || hay(f).includes(qq);
    const main = fams.filter(inFilter).filter(ok).sort(bySort).map(famCard).join("");
    const demo = famFilter === "all" ? fams.filter((f) => f.isDemo).filter(ok).sort(bySort) : [];
    const tail = demo.length
      ? `<div class="top" style="margin-top:22px"><h3>🧪 משפחות דמו · ${fmt(demo.length)}</h3></div>` + famTable(demo.map(famCard).join(""))
      : "";
    return (main ? famTable(main) : (tail ? "" : '<div class="empty">אין משפחות בסינון הזה.</div>')) + tail;
  };
  $("main").innerHTML = `
    <div class="top"><h3>משפחות · ${fmt(fams.filter((f) => !f.isDemo).length)}${fams.some((f) => f.isDemo) ? ` <span class="m" style="font-weight:400">· ${fmt(fams.filter((f) => f.isDemo).length)} דמו</span>` : ""}</h3><div class="filters">${FILTERS.map(([k, l]) => `<span class="chip ${famFilter === k ? "on" : ""}" data-f="${k}">${l} <b>${fmt(countFor(k))}</b></span>`).join("")}<span class="chip search">🔎 <input id="famSearch" placeholder="חיפוש" value="${esc(famQuery)}"></span></div></div>
    <div id="famList">${listHTML()}</div>`;
  document.querySelectorAll("[data-f]").forEach((c) => c.onclick = () => { famFilter = c.dataset.f; families(); });
  const inp = $("famSearch"); inp.oninput = () => { famQuery = inp.value; redrawList(); };

  // tab — a heavy refetch that also threw away the scroll position.
  redrawList = () => {
    $("famList").innerHTML = listHTML();
    wireFam();
  };
  wireFam();
}
/// Mutate one family in place and repaint the list — no network, no scroll jump.
let redrawList = () => {};
function patchFam(hh, fn) {
  const f = (FAM && FAM.families || []).find((x) => (x.fullId || x.householdID || x.id) === hh);

/// How long since anyone in the family opened Tofy — the column the table sorts
/// by, so "who went quiet" is one click away.
function famWhen(f) {
  const last = (f.children || []).map((k) => ((J && J.children && J.children[k.fullId || k.id]) || {}))
    .map((c) => c.lastActive).filter(Boolean).sort().pop();
  if (!last) return { cls: "cold", text: "עוד לא שיחקו", days: 99999 };
  const d = Math.max(0, Math.round((Date.now() - new Date(last + "T12:00:00").getTime()) / 86400000));
  if (d === 0) return { cls: "live", text: "היום", days: 0 };
  if (d === 1) return { cls: "", text: "אתמול", days: 1 };
  if (d < 30) return { cls: "", text: `לפני ${d} ימים`, days: d };
  return { cls: "cold", text: `לפני ${Math.round(d / 30)} חודשים`, days: d };
}

/// Everything the table needs about one family, computed once.
function famStats(f) {
  const kids = f.children || [];
  const today = kids.reduce((n, k) => n + ((((J && J.children && J.children[k.fullId || k.id]) || {}).today || {}).questions || 0), 0);
  const joined = Math.min(...kids.map((k) => k.createdAt || Infinity).concat([Infinity]));
  return { kids: kids.length, today, joined: isFinite(joined) ? joined : 0, when: famWhen(f) };
}

function famStateChip(f) {
  const j = f.j || {}, state = j.state || "free_new";
  if (state === "plus") return `<span class="chip gold" style="padding:2px 8px;font-size:11px">👑 ${j.plan === "yearly" ? "שנתי" : "חודשי"}</span>`;
  if (state === "gift") return `<span class="chip mint" style="padding:2px 8px;font-size:11px">🎁 ${daysLeft(j.daysLeft)}</span>`;
  if (state === "gift_expiring") return `<span class="chip pink" style="padding:2px 8px;font-size:11px">🎁 נגמרת ${days(j.daysLeft)}</span>`;
  const [l] = STATE[state] || STATE.free_new;
  return `<span class="state">${l}</span>`;
}

function famCard(f) {
  const st = famStats(f), j = f.j || {};
  const parents = (f.parents || []).filter((p) => !p.anonymous || p.isGuestParent);
  const who = parents.map((p) => p.email || p.name).filter(Boolean).slice(0, 2).join(" · ")
    || (parents.length ? "הורה בלי מייל" : "אורח");
  const label = f.label ? `<span class="state" style="margin-inline-start:6px">🏷 ${esc(f.label)}</span>` : "";
  const demo = f.isDemo ? '<span class="state" style="margin-inline-start:6px">🧪</span>' : "";

  // The detail strip under the row: the children, what they did today, and the
  // devices — visible on demand instead of crowding every line.
  const kidPills = (f.children || []).map((k) => {
    const c = (J && J.children && J.children[k.fullId || k.id]) || {}, t = c.today || {};
    const girl = (k.gender || c.gender) === "girl";
    const act = t.questions ? `${t.questions} שאלות היום · ${pct(Math.round(100 * (t.correct || 0) / t.questions))}`
      : c.lastActive ? "אחרון " + c.lastActive.slice(5).replace("-", ".") : (girl ? "עוד לא שיחקה" : "עוד לא שיחק");
    return `<span class="${t.questions ? "" : "quiet"}">🧒 ${esc(k.name)}${k.grade != null ? " · " + gradeName(k.grade) : ""} · ${act}</span>`;
  }).join("");
  const devPills = (f.children || []).flatMap((k) => (k.deviceRows || []).map((d) => {

    return `<span class="quiet">📱 ${esc(k.name)} · ${d.kind === "ipad" ? "אייפד" : d.kind === "iphone" ? "אייפון" : esc(d.name || "מכשיר")}${age ? " · " + age : ""}${d.appVersion ? " · גרסה " + esc(String(d.appVersion).replace(/^.*\((\d+)\)$/, "$1")) : ""}</span>`;
  })).join("");
  const source = j.purchaseSource ? `<span class="quiet">💳 ${esc(SOURCE[j.purchaseSource] || j.purchaseSource)}</span>` : "";

  return `<tr class="frow" data-row="${esc(f.hh)}">
    <td><div class="fname">${esc(famName(f))}${label}${demo}</div><div class="fmail">${esc(who)}${parents.length > 1 ? " · " + parents.length + " הורים" : ""}</div></td>
    <td>${famStateChip(f)}</td>
    <td class="num">${fmt(st.kids)}</td>
    <td class="${st.when.cls}">${st.when.text}</td>
    <td class="num">${st.today ? fmt(st.today) : "—"}</td>
    <td class="num">${st.joined ? dateShort(st.joined) : "—"}</td>
    <td class="menucell"><button class="dots" type="button" data-menu aria-label="פעולות">⋯</button>
      <div class="rowmenu">
        <button data-gift="${esc(f.hh)}">🎁 הארך מתנה</button>
        <button data-endgift="${esc(f.hh)}">⏹ סיים מתנה</button>
        <button data-world="${esc(f.hh)}">🌍 פתח עולם</button>
        <a href="notifications.html">📣 שלח הודעה</a>
        <a href="families.html">🧒 פרטי הילדים</a>
        <button data-label="${esc(f.hh)}" data-cur="${esc(f.label || "")}">🏷 תווית</button>
        <div class="sep"></div>
        <button data-demo="${esc(f.hh)}" data-on="${f.isDemo ? "1" : ""}">${f.isDemo ? "↩︎ בטל דמו" : "🧪 סמן כדמו"}</button>
        <button class="danger" data-del="${esc(f.hh)}" data-name="${esc(famName(f))}">🗑 מחיקת המשפחה</button>
      </div></td>
  </tr>
  <tr class="fdet" data-det="${esc(f.hh)}" hidden><td colspan="7"><div class="pills">${kidPills}${devPills}${source}</div></td></tr>`;
}

/// The table around the rows — the header cells are the sort control.
const FAM_COLS = [["name", "משפחה"], ["state", "מצב"], ["kids", "ילדים"], ["active", "פעילות אחרונה"],
  ["today", "שאלות היום"], ["joined", "הצטרפו"], ["", ""]];
function famTable(rows) {

        <div class="stamp">${done ? "כל הקבצים המוכנים כבר בענן — אין מה לפרסם." : `מוכנות כאן לפרסום: ${fmt(left)} שאלות חדשות מתוך ${fmt(ready)} ב־${batches.length} קבצים`}</div>
        <div id="res-${L.id}" style="margin-top:8px;font-size:13px"></div>

  };

  const runLine = !lr ? "עוד לא רץ." :
    `רץ לאחרונה ${when(lr.at)} · ${lr.files || 0} קבצים · נוספו ${fmt(lr.added || 0)} (🇮🇱 ${fmt((lr.byLang || {}).he || 0)} · 🇺🇸 ${fmt((lr.byLang || {}).en || 0)})` +
    `${lr.approved ? ` · אושרו ${fmt(lr.approved)}` : ""}${lr.duplicates ? ` · ${fmt(lr.duplicates)} כבר היו` : ""}` +
    `${lr.rejected ? ` · ${fmt(lr.rejected)} נדחו בבדיקה` : ""}${(lr.failed || []).length ? ` · ⚠️ ${lr.failed.length} כשלונות` : ""}`;
  const autoCard = `<div class="card" style="margin-bottom:14px">
    <h4>🤖 פרסום אוטומטי</h4>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0">
      <span class="sw ${auto.autoPublish ? "on" : ""}" id="autoSw"></span>
      <b>${auto.autoPublish ? "דלוק — אין מה ללחוץ" : "כבוי — צריך ללחוץ ידנית"}</b>
      <button class="btn ghost" id="autoRun">הרץ עכשיו</button>
    </div>
    <div class="stamp" style="line-height:1.8">כל שעה השרת מושך את קבצי השאלות מהאתר, מעביר כל שאלה באותה בדיקה אוטומטית (3 מסיחים שונים, התשובה לא ביניהם, טווח כיתות תקין, ניקוד בעברית, אנגלית מלאה באנגלית), מדלג על כפילויות, ומאשר גם טיוטות שנשארו ממתינות. שאלה קיימת לא משתנה ושום דבר לא נמחק.</div>
    <div class="stamp" style="margin-top:6px" id="autoLast">${runLine}</div>
    ${(lr && (lr.samples || []).length) ? `<details style="margin-top:8px"><summary style="cursor:pointer;font-weight:700">שאלות שנדחו בבדיקה (${lr.samples.length} לדוגמה)</summary>${lr.samples.map((s) => `<div class="stamp" style="padding:6px 0;border-bottom:1px solid var(--line)">${s.lang === "en" ? "🇺🇸" : "🇮🇱"} <b>${esc(s.prompt || "")}</b> — ${esc((s.problems || []).join(", "))}</div>`).join("")}</details>` : ""}
    ${(lr && (lr.failed || []).length) ? `<div class="stamp" style="margin-top:6px;color:#F5C049">${lr.failed.slice(0, 4).map(esc).join("<br>")}</div>` : ""}
  </div>`;
  $("genBatches").innerHTML = autoCard + LANGS.map(block).join("");
  LANGS.forEach((L) => { const saved = sessionStorage.getItem("admin.bulk." + L.id); if (saved && $("res-" + L.id)) $("res-" + L.id).textContent = saved; });

  const autoBusy = (text) => { $("autoLast").innerHTML = `<span class="spin"></span> ${text}`; $("autoSw").style.pointerEvents = "none"; $("autoRun").disabled = true; };
  $("autoSw").onclick = async () => {
    const on = !auto.autoPublish;
    if (on && !confirm("להדליק פרסום אוטומטי?\n\nכל שעה השרת יפרסם לילדים כל שאלה חדשה שנמצאת בקבצים באתר, בעברית ובאנגלית, אחרי שהיא עוברת את הבדיקה האוטומטית. שאלה שנכשלת בבדיקה לא מתפרסמת ומופיעה כאן. אפשר לכבות בכל רגע.")) return;
    autoBusy(on ? "מדליק ומריץ סבב ראשון…" : "מכבה…");
    try { const r = await call("adminSetAutoPublish", { enabled: on }); toast(on ? `פרסום אוטומטי דלוק · נוספו ${fmt((r.run || {}).added || 0)}` : "פרסום אוטומטי כבוי"); COV = null; importQuestions(); }
    catch (e) { toast("נכשל: " + e.message); loadBatches(); }
  };
  $("autoRun").onclick = async () => {
    autoBusy("מריץ סבב מלא — ייבוא, בדיקה ואישור…");
    try { const r = await call("adminRunAutoPublish", {}); const x = r.run || {}; toast(`✅ נוספו ${fmt(x.added || 0)} · אושרו ${fmt(x.approved || 0)}${x.rejected ? ` · ${fmt(x.rejected)} נדחו` : ""}`); COV = null; importQuestions(); }
    catch (e) { toast("נכשל: " + e.message); loadBatches(); }
  };

  // 🚀 One button per language: import every file of that language, approved, then
  // sweep up anything imported earlier and left waiting.
  LANGS.forEach((L) => {
    const btn = $("pub-" + L.id); if (!btn) return;
    btn.onclick = async () => {
      const batches = all.filter((b) => (b.lang || "he") === L.id);
      const ready = batches.reduce((n, b) => n + (b.count || 0), 0);
      if (!confirm(`לפרסם לילדים את כל השאלות ${L.flag} ${L.name}? (${fmt(ready)} שאלות ב־${batches.length} קבצים; מה שכבר קיים פשוט ידולג)`)) return;
      const msg = $("msg-" + L.id), res = $("res-" + L.id);
      LANGS.forEach((x) => { if ($("pub-" + x.id)) $("pub-" + x.id).disabled = true; });
      let added = 0, dup = 0, rejected = 0, failed = 0;
      for (let i = 0; i < batches.length; i++) {
        const b = batches[i];
        msg.textContent = `מייבא ${i + 1}/${batches.length} · ${(T[b.topic] || {}).label || b.topic}…`;
        try {
          const items = await (await fetch(`generated/${b.file}?v=` + Date.now())).json();
          const r = await call("adminImportQuestions", { topic: b.topic, items, approve: true, lang: L.id });
          added += r.added || 0; dup += r.duplicates || 0; rejected += (r.rejected || []).length;
        } catch (e) { failed++; console.error("import failed", b.file, e); }
      }
      // Anything imported before today's click may still be waiting — approve it too.
      let approved = 0;
      const topics = [...new Set(batches.map((b) => b.topic).concat(Object.keys(summary.topics || {})))];
      for (let i = 0; i < topics.length; i++) {
        msg.textContent = `מאשר ${i + 1}/${topics.length}…`;
        try {
          const r = await call("adminQuestionBankSummary", { draftsFor: topics[i], lang: L.id });
          const ids = (r.drafts || []).map((q) => q.id);
          if (!ids.length) continue;
          await call("adminSetQuestionStatus", { topic: topics[i], ids, status: "approved" });
          approved += ids.length;
        } catch (e) { failed++; console.error("approve failed", topics[i], e); }
      }
      msg.textContent = "";
      const line = `${L.flag} נוספו ${fmt(added)} שאלות${dup ? ` · ${fmt(dup)} כבר היו` : ""}${approved ? ` · אושרו ${fmt(approved)}` : ""}${rejected ? ` · ${rejected} נדחו` : ""}${failed ? ` · ${failed} כשלונות` : ""}`;
      sessionStorage.setItem("admin.bulk." + L.id, line);
      if (res) res.textContent = line;
      toast(line);
      COV = null; importQuestions();
    };
  });

  document.querySelectorAll("[data-batch]").forEach((btn) => btn.onclick = async () => {
    const topic = btn.dataset.batch; btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
    try {
      const items = await (await fetch(`generated/${btn.dataset.file}?v=` + Date.now())).json();
      const r = await call("adminImportQuestions", { topic, items, approve: true, lang: btn.dataset.lang || "he" });
      toast(`✅ נוספו ${r.added}${r.duplicates ? ` · ${r.duplicates} כבר היו` : ""}${(r.rejected || []).length ? ` · ${r.rejected.length} נדחו` : ""}`);
      COV = null; IMP_TOPIC = topic; DRAFT_GRADE = null; importQuestions();
    } catch (e) { toast("נכשל: " + e.message); btn.disabled = false; btn.textContent = "ייבוא הקובץ הזה"; }
  });
}

async function loadDrafts() {
  const topic = $("impTopic") ? $("impTopic").value : IMP_TOPIC;
  try {
    const r = await call("adminQuestionBankSummary", { draftsFor: topic, lang: QLANG });
    const all = r.drafts || [];
    if (!all.length) return $("drafts").innerHTML = '<div class="empty">אין טיוטות לעולם הזה.</div>';
    // A generated batch is 200 drafts per grade — review grade by grade, not as one 1,200-row list.
    const GR = ["גן", "א׳", "ב׳", "ג׳", "ד׳", "ה׳", "ו׳", "ז׳", "ח׳"];
    const grades = [...new Set(all.map((q) => q.gradeLo))].sort((a, b) => a - b);
    if (DRAFT_GRADE !== null && !grades.includes(DRAFT_GRADE)) DRAFT_GRADE = null;
    const d = DRAFT_GRADE === null ? all : all.filter((q) => q.gradeLo === DRAFT_GRADE);
    const gchip = (g, label, n) => `<span class="chip ${DRAFT_GRADE === g ? "on" : ""}" data-drg="${g === null ? "" : g}">${label} <b>${n}</b></span>`;
    $("drafts").innerHTML = `<div class="filters" style="margin-bottom:8px">${gchip(null, "הכל", all.length)}${grades.map((g) => gchip(g, GR[g] || g, all.filter((q) => q.gradeLo === g).length)).join("")}</div>
      <div style="display:flex;gap:6px;margin-bottom:8px"><button class="btn" id="drAll">בחר את כל ${d.length} המוצגות</button><button class="btn" id="drApprove">✅ אשר נבחרות</button><button class="btn danger" id="drReject">🗑 דחה נבחרות</button></div>
      ${d.map((q) => `<label class="q" style="display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--line)"><input type="checkbox" data-dr="${esc(q.id)}"><div><div style="white-space:pre-line"><b>${esc(q.prompt)}</b></div><div style="font-size:12px">✔️ ${esc(q.correctAnswer)} · ✖️ ${esc((q.distractors || []).join(" · "))}</div><div class="stamp">כיתות ${q.gradeLo}–${q.gradeHi} · ${esc(q.tier || "")}</div></div></label>`).join("")}`;
    const picked = () => [...document.querySelectorAll("[data-dr]:checked")].map((x) => x.dataset.dr);
    document.querySelectorAll("[data-drg]").forEach((c) => c.onclick = () => { DRAFT_GRADE = c.dataset.drg === "" ? null : Number(c.dataset.drg); loadDrafts(); });
    $("drAll").onclick = () => document.querySelectorAll("[data-dr]").forEach((x) => x.checked = true);
    const act = async (status) => { const ids = picked(); if (!ids.length) return toast("לא נבחרו שאלות"); if (status === "rejected" && !confirm(`למחוק ${ids.length} שאלות?`)) return; await call("adminSetQuestionStatus", { topic, ids, status }); toast(status === "approved" ? `אושרו ${ids.length}` : `נמחקו ${ids.length}`); COV = null; loadDrafts(); };
    $("drApprove").onclick = () => act("approved");
    $("drReject").onclick = () => act("rejected");
  } catch (e) { $("drafts").textContent = e.message; }
}

const nv = (x, suf = "", fallback = "—") => (x === null || x === undefined || Number.isNaN(x)) ? fallback : (typeof x === "number" ? x.toLocaleString("he-IL") : x) + suf;

    <div class="kpis">
      ${kpi(fmt(c.households ?? "—"), "משפחות שנסרקו")}
      ${kpi(fmt(c.inactive ?? 0), "לא פעילות מעל הסף")}
      ${kpi(fmt(c.noticed ?? 0), "קיבלו הודעה · " + fmt(c.waitingGrace ?? 0) + " בהמתנה")}
      ${kpi(fmt((del.counts || c).deletable ?? 0), "מוכנות למחיקה")}
      ${kpi(fmt(c.returned ?? 0), "חזרו לפעילות אחרי ההודעה")}
      ${kpi(fmt(c.undetermined ?? 0), "חסר נתון — לא נוגעים")}
    </div>
    <div class="stamp" style="margin-bottom:12px">סריקה אחרונה: ${scan.at ? when(scan.at * 1000) : "—"}${scan.dryRun ? " · מצב יבש" : ""} · דוח המחיקה השבועי: ${del.at ? when(del.at * 1000) : "—"} · ניקוי רשימת ההמתנה: ${wl.at ? `${when(wl.at * 1000)} · נמחקו ${fmt(wl.deleted || 0)}, נשארו ${fmt(wl.kept || 0)}` : "—"}</div>
    <h4>מוכנות למחיקה · ${fmt(rows.length)}</h4>
    ${rows.length ? rows.map(retRow).join("") : '<div class="empty">אין משפחה שעברו לה 30 יום מההודעה והיא עדיין לא פעילה.</div>'}
    ${cand.length ? `<h4 style="margin-top:16px">${cfg.enabled ? "ממתינות להודעה" : "היו מקבלות הודעה עכשיו"} · ${fmt(cand.length)}</h4>${cand.slice(0, 50).map((x) => retLine(x)).join("")}` : ""}
    ${pend.length ? `<h4 style="margin-top:16px">בתוך 30 הימים שאחרי ההודעה · ${fmt(pend.length)}</h4>${pend.slice(0, 50).map((x) => retLine(x, `${daysLeft(x.daysLeft || 0)}`)).join("")}` : ""}
    ${und.length ? `<h4 style="margin-top:16px">חסר נתון — לא ייכנסו למחיקה · ${fmt(c.undetermined || 0)}</h4>${und.slice(0, 30).map((x) => retLine(x, retWhy(x.reason))).join("")}` : ""}`;
  $("retRun").onclick = () => retention(true);
  $("retSw").onclick = async () => {
    const on = !cfg.enabled;
    if (on && !confirm("להדליק שליחת הודעות מחיקה?\n\nכל משפחה שאין בה שום פעילות כבר 18 חודשים תקבל הודעה אחת — פוש למכשירי ההורים ומייל — שהנתונים יימחקו בעוד 30 יום. כל פעילות מבטלת את ההודעה, והמחיקה עצמה נשארת ידנית לגמרי.")) return;
    try { await call("adminSetRetentionEnabled", { enabled: on }); toast(on ? "הודעות המחיקה דלוקות" : "חזרנו למצב יבש"); retention(); }
    catch (e) { toast("נכשל: " + e.message); }
  };
  document.querySelectorAll("[data-retdel]").forEach((b) => b.onclick = async () => {
    if (!confirm(`למחוק לצמיתות את הנתונים של "${b.dataset.retname}"?\n\nכל פרופילי הילדים, ההתקדמות, המטלות וחשבון המשפחה יימחקו. השרת בודק שוב לפני המחיקה שהמשפחה עדיין לא פעילה ושעברו 30 יום מההודעה. אי אפשר לבטל — שחזור אפשרי רק עד 7 ימים אחורה.`)) return;
    b.disabled = true; b.innerHTML = '<span class="spin"></span>';
    try { await call("adminDeleteHousehold", { householdID: b.dataset.retdel, retention: true }); toast("המשפחה נמחקה"); FAM = null; retention(); }
    catch (e) { b.disabled = false; b.textContent = "🗑 מחק"; toast("נכשל: " + e.message); }
  });
}
</script>
</body>
</html>
