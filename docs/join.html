<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#5E60CE">
<title>חיבור מכשיר — טופי</title>
<meta name="description" content="חיבור מכשיר של ילד לאפליקציית טופי.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://tofyapp.com/join.html">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap">
<link rel="stylesheet" href="glass.css?v=4">
</head>
<body>
<div class="backdrop"></div>
<div class="sparks" id="sparks"></div>

<main class="mini">
  <div class="card pane">
    <img class="lion" src="lion.png" alt="טופי">
    <h1>טופי</h1>
    <p>כדי לחבר את מכשיר הילד, פתחו את אפליקציית <b>טופי</b> במכשיר הזה — והחיבור יקרה אוטומטית.</p>
    <p style="font-size:15.5px">אם האפליקציה עדיין לא מותקנת, התקינו אותה ואז סרקו שוב את הקוד.</p>
    <a class="btn ghost" href="/">חזרה לאתר טופי</a>
  </div>
</main>

<script>
  (function(){
    var c = document.getElementById("sparks");
    for (var i = 0; i < 34; i++) {
      var s = document.createElement("div");
      s.className = "spark"; s.textContent = "\u2726";
      s.style.left = (Math.random()*100) + "%";
      s.style.top = (Math.random()*100) + "%";
      s.style.fontSize = (6 + Math.random()*14) + "px";
      s.style.color = Math.random() < .5 ? "#FFD23F" : "#fff";
      s.style.animationDelay = (Math.random()*3.4) + "s";
      c.appendChild(s);
    }
  })();
</script>
</body>
</html>
