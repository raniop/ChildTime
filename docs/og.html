<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  /* The share card. Render at exactly 1200×630 → og-image.jpg.
     WhatsApp crops link previews to a CENTRE SQUARE when it shows the small
     thumbnail, so everything that matters — the icon, the name, the line —
     lives inside the middle 630×630. */
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{font-family:"Heebo","Helvetica Neue",Arial,sans-serif;color:#fff;position:relative;
    background:linear-gradient(150deg,#7A5CFF 0%,#5E60CE 48%,#3E8BF0 100%);
    display:grid;place-items:center}
  .orb{position:absolute;border-radius:50%;filter:blur(80px)}
  .orb.a{width:620px;height:620px;top:-220px;right:-140px;background:radial-gradient(circle,rgba(255,107,157,.6),transparent 68%)}
  .orb.b{width:640px;height:640px;bottom:-260px;left:-160px;background:radial-gradient(circle,rgba(72,191,227,.55),transparent 68%)}
  .card{position:relative;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
  .icon{width:236px;height:236px;border-radius:52px;box-shadow:0 30px 70px rgba(10,4,40,.5);
    border:1px solid rgba(255,255,255,.3)}
  .brand{font-size:76px;font-weight:900;line-height:1;
    background:linear-gradient(180deg,#FFF0BE,#FFD23F 60%,#F2A93B);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  h1{font-size:44px;font-weight:900;line-height:1.15;
    background:linear-gradient(180deg,#fff,#FFE9A8);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{font-size:25px;font-weight:500;color:rgba(255,255,255,.88)}
  .star{position:absolute;color:#FFD23F;opacity:.9}
</style>
</head>
<body>
  <div class="orb a"></div><div class="orb b"></div>
  <div class="card">
    <img class="icon" src="icon.png" alt="">
    <div class="brand">טופי</div>
    <h1>זמן מסך שמרוויחים בלמידה</h1>
    <div class="sub">לומדים, עונים על שאלות — ומרוויחים דקות משחק</div>
  </div>
  <div class="star" style="top:70px;left:150px;font-size:38px">✦</div>
  <div class="star" style="top:130px;right:170px;font-size:26px;color:#fff">✦</div>
  <div class="star" style="bottom:90px;left:210px;font-size:30px;color:#fff">✦</div>
  <div class="star" style="bottom:120px;right:150px;font-size:36px">✦</div>
</body>
</html>
