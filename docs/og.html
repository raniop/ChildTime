<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    font-family:"Heebo","Helvetica Neue","Arial Hebrew",Arial,sans-serif;
    background:linear-gradient(135deg,#5E60CE 0%,#6A4BD0 45%,#48BFE3 100%);
    color:#fff; display:flex; align-items:center; justify-content:center;
    gap:56px; position:relative;
  }
  .lion{width:380px; height:auto; filter:drop-shadow(0 22px 44px rgba(0,0,0,.32))}
  .txt{text-align:center}
  .brand{
    font-size:158px; font-weight:900; line-height:1;
    background:linear-gradient(180deg,#FFF0BE,#FFD23F 55%,#F2A93B);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 8px 34px rgba(255,210,63,.30);
  }
  .sub{font-size:48px; font-weight:800; margin-top:14px; opacity:.97}
  .star{position:absolute; color:#FFD23F; opacity:.9}
</style>
</head>
<body>
  <img class="lion" src="lion.png" alt="">
  <div class="txt">
    <div class="brand">טופי</div>
    <div class="sub">לומדים ומרוויחים זמן מסך</div>
  </div>
  <div class="star" style="top:70px; left:560px; font-size:42px">✦</div>
  <div class="star" style="top:150px; right:150px; font-size:30px; color:#fff">✦</div>
  <div class="star" style="bottom:90px; left:150px; font-size:36px">✦</div>
  <div class="star" style="bottom:150px; right:430px; font-size:24px; color:#fff">✦</div>
</body>
</html>
